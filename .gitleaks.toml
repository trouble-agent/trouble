# .gitleaks.toml — the Tier 1 `secrets` scan surface for the trouble repo.
#
# WHY THIS FILE EXISTS
#
# The GitReins Tier 1 `secrets` step runs `gitleaks detect --no-git`, i.e. it
# walks the WORKING TREE and does NOT honour .gitignore. On this repo that made
# the step structurally RED — the dogfood run of 2026-09-17 counted 292
# gitleaks findings, none of them a credential:
#
#   * the great majority inside `.worktrees/` — a kanban-era artifact tree that
#     is gitignored (see .gitignore) and never part of a commit or a release;
#   * the rest inside tracked corpus files that must contain secret-SHAPED text
#     by construction: the scrub rule table itself, SPEC-02's marker/vector
#     examples, the scrub test vectors, and SPEC-08/SPEC-TYPES idempotency-key
#     examples. A scrubber's test corpus is made of things that look exactly
#     like secrets — that is the point of it.
#
# Because the scan surface was RED for reasons unrelated to any diff, EVERY
# judge run reported `tier1 FAIL` and the step detected nothing: the signal was
# gone. This file narrows the scan surface so the step once again reports on
# what a commit actually introduces.
#
# SCOPE RULES (do not widen without the same evidence)
#
#   * Every entry is an EXPLICIT FILE PATH or the one gitignored tree. No
#     directory globs (`internal/` is deliberately NOT allowlisted), no generic
#     regexes.
#   * `.worktrees/` is allowlisted because it is gitignored build output. If a
#     real secret were ever written there it would not be committed, and this
#     guard's job is to grade the commit, not scratch space.
#   * The remaining entries are the exact files that carry secret-SHAPED
#     fixtures. They are exhaustively enumerated: adding a NEW fixture file
#     means adding a NEW line here, in review, on purpose.
#   * The file list is a floor, not a licence: a real credential committed to a
#     NOT-listed path is still caught (see the planted-secret proof in
#     docs/operations.md §13).
#
# HOW THE TIER 1 STEP PICKS THIS UP
#
# GitReins renders its own temp config that does `[extend] path = <this file>`
# and adds its harness-state allowlist (`.gitreins/**`) on top; gitleaks merges
# both allowlists. The built-in cross-check that runs beside gitleaks
# (engine/guard_manager.py::_load_gitleaks_allowlist) reads the triple-quoted
# path patterns in this file too, so both scanners are scoped by the same
# decision. Keep every triple-quoted string in this file a PATH pattern — that
# scraper treats each one as a path regex.
#
# `useDefault = true` is required, not optional: gitleaks rejects
# `extend.path` together with `extend.useDefault`, so the ruleset that is being
# extended FROM has to carry the default rules itself.

title = "trouble"

[extend]
useDefault = true

[[allowlists]]
description = "gitignored kanban-era artifact tree (.worktrees/ in .gitignore) — scratch checkouts, never committed"
paths = [
  '''(^|/)\.worktrees/.*''',
]

[[allowlists]]
description = "scrub corpus: the scrubber's own rule table and its test vectors. These MUST contain secret-shaped literals — that is what a scrubber matches on."
paths = [
  '''(^|/)internal/scrub/rules\.go$''',
  '''(^|/)internal/scrub/testdata/vectors/vectors\.txt$''',
  '''(^|/)internal/scrub/ac_test\.go$''',
  '''(^|/)internal/scrub/conformance_test\.go$''',
  '''(^|/)internal/scrub/dsn_test\.go$''',
  '''(^|/)internal/scrub/e2e_ledger_test\.go$''',
  '''(^|/)internal/scrub/flagvalue_test\.go$''',
  '''(^|/)internal/scrub/helpers_test\.go$''',
  '''(^|/)internal/scrub/shield_test\.go$''',
  '''(^|/)internal/scrub/vectors_test\.go$''',
]

[[allowlists]]
description = "tracked tests whose fixtures are secret-shaped by construction (ledger scrub boundary, sentinel/flow idempotency keys, lifecycle config/project keys, dashboard auth key, issue idempotency keys, CLI flag fixture)"
paths = [
  '''(^|/)internal/app/flow_spool_wiring_test\.go$''',
  '''(^|/)internal/dashboard/auth_test\.go$''',
  '''(^|/)internal/flow/spool_test\.go$''',
  '''(^|/)internal/issues/github_driver_test\.go$''',
  '''(^|/)internal/ledger/scrub_boundary_test\.go$''',
  '''(^|/)internal/ledger/verify_payload_hash_test\.go$''',
  '''(^|/)internal/lifecycle/config_test\.go$''',
  '''(^|/)internal/lifecycle/projects_test\.go$''',
  '''(^|/)internal/sentinel/helpers_test\.go$''',
  '''(^|/)cmd/troubled/main_test\.go$''',
]

[[allowlists]]
description = "spec and generated-doc examples that quote the scrubber's own markers and vectors verbatim (SPEC-02 marker/vector tables, SPEC-08 + SPEC-TYPES idempotency keys, the generated specs review page)"
paths = [
  '''(^|/)specs/SPEC-02-scrubbing\.md$''',
  '''(^|/)specs/SPEC-08-flow\.md$''',
  '''(^|/)specs/SPEC-TYPES\.md$''',
  '''(^|/)docs/specs-review\.html$''',
]

[[allowlists]]
description = "gitleaks generic-api-key false positive on Redis INFO fixture text in a fake-stream test; no credential is present, so the exemption is scoped to the matching LINE as well as the path"
paths = [
  '''(^|/)internal/hub/redis_test\.go$''',
]
regexTarget = "line"
regexes = ["evicted_keys"]

[[allowlists]]
description = "the documented synthetic DSN credential used in the README quickstart curl and the historical commits that carried it: a sequential-hex placeholder (0123456789abcdef...) that is not and never was a credential. Scoped to the exact placeholder on the line, so a real key pasted into README or history is still caught."
paths = [
  '''(^|/)README\.md$''',
  '''^\.gitreins/history/.*\.patch$''',
]
regexTarget = "line"
regexes = ['''0123456789abcdef0123456789abcdef''']

[[allowlists]]
description = "the second documented dev placeholder: the container quickstart's project secret (deploy/container/config.toml) and the tests that pin the same literal. The value is a sequential-hex dummy (fedcba...) and the config says so in-line (\"documented DEV placeholder: rotate both keys before anything real reports here\"), but the shape is fixed BY CONTRACT — SPEC-12 §3.1a requires a project secret to be exactly 32 lowercase hex, so a placeholder here cannot be made non-secret-shaped without failing the boot the file exists to demonstrate. Scoped to the exact literal on the line, so a real key pasted into any of these paths is still caught."
paths = [
  '''(^|/)deploy/container/config\.toml$''',
  '''(^|/)internal/app/container_posture_test\.go$''',
  '''(^|/)internal/lifecycle/projects_test\.go$''',
]
regexTarget = "line"
regexes = ['''fedcba9876543210fedcba9876543210''']

# TRBL-131 — WHY THIS ENTRY IS A ONE-FILE PATH EXEMPTION AND NOT A LINE-SCOPED
# (RE)THE ONE BELOW IT. Everything here was measured against gitleaks v8.30.1,
# the binary the Tier 1 `secrets` step runs, on a full-fidelity checkout of this
# repo (worktree at HEAD, planted-credential fixtures, both arms):
#
#   a) A global `[[allowlists]]` entry that carries `paths` is applied as a
#      SOURCE FILTER. The file is skipped before any rule runs, so adding
#      `regexes` / `regexTarget` / `condition = "AND"` to that same entry does
#      NOT narrow it — planted credential on a board line, 0 findings.
#   b) A `paths`-less entry is ignored entirely: `regexes` alone, `stopwords`
#      alone, and `regexTarget = "line"` / `"match"` alone each leave every
#      finding in place.
#   c) `.gitleaksignore` cannot carry the fix either: with `--no-git` the
#      fingerprint is `<file>:<rule>:***` (the secret component is masked), so
#      one entry suppresses the whole file and per-line precision is lost.
#   d) Attaching a rule-level allowlist to the built-in `generic-api-key` rule
#      requires copying that rule — plus its ~1,400-line stopword table — into
#      this file, which would drift from upstream on the next gitleaks bump.
#
# So the exemption is file-scoped, and the COMPENSATING CONTROL is deliberate:
# the path pattern below is a DOUBLE-quoted TOML string. The builtin
# cross-check scanner (engine/guard_manager.py::_load_gitleaks_allowlist) only
# compiles triple-quoted literal-string entries, so it does NOT pick this
# pattern up and keeps
# scanning the board file in full — the board is exempt from gitleaks and still
# graded by the builtin scanner. Every other path stays gradeable by both: a
# credential planted anywhere outside this one file is still caught by
# gitleaks (demonstrated: `.coding-hermes/board/tasks.jsonl` exempt, planted
# token under docs/ still reported).
#
# If a future gitleaks supports per-line global allowlists, replace this with
# that mechanism and delete this note.
[[allowlists]]
description = "the tracked work board (.coding-hermes/board/tasks.jsonl) quotes the redaction placeholder as EVIDENCE: three of its rows record a security finding whose text is 'token-hash assertion, REDACTED' / 'Secret=REDACTED' / 'token store, REDACTED', and gitleaks' generic-api-key rule reads that prose as a key assignment — three findings, zero credentials, measured 2026-11-04. The exemption is the single path below, not a directory or a regex, and it is the only file in this repo where the redaction word is written on purpose; the builtin cross-check still scans this file because the pattern is not a triple-quoted literal (see the note above)."
paths = [
  "(^|/)\\.coding-hermes/board/tasks\\.jsonl$",
]
