# trouble — container configuration, LIGHT-HUB profile (TRBL-002 part B).
#
# Identical to deploy/container/config.toml except for the SPEC-13 server
# profile stanza:
#
#   [server]
#   profile = "light-hub"
#   [server.redis]
#   url = "redis://redis:6379/0"
#
# ============================================================================
# HONEST STATUS OF THIS FILE — VERIFY BEFORE USE.
#
# The `[server]` surface IS registered (SPEC-13 §2.1 and §2.1.1 keys resolve as
# ordinary config keys and `trouble config explain` lists each with its source),
# so this file RESOLVES and the light-hub profile passes the boot gate when
# server.redis.url and server.duckbrain.namespace are both declared. Before that
# registration this file was refused with TROUBLE-LIFECYCLE-001 (unknown file
# key) — see TRBL-027 and docs/operations.md §14.
#
# The profile's RUNTIME — the Redis stream and consumer group, the dedup gate,
# the degradation state machine and the DuckBrain archival tier (SPEC-13 §2.3) —
# IS built as of TRBL-029: a light-hub boot opens the queue, mounts it in front
# of the sentinel's ledger sink, and /health.json carries a `hub` stanza
# (aof/policy/evicted_keys from the INFO preflight, stream_len, pending, lag,
# dedup counters, archive queue, route counters). With server.duckbrain.endpoint
# left empty the archival tier pauses with TROUBLE-HUB-009 while ingestion keeps
# serving — set it to enable archival. The compose default still mounts
# config.toml (standalone) for a zero-dependency first boot, and the redis
# service in docker-compose.yml runs under the SPEC-13 preflight constraints
# (appendonly yes, maxmemory-policy noeviction). Switch the compose volume
# source to this file to run the hub; do not delete the keys to make a boot pass.
# ============================================================================
#
# SPEC-13 behaviour this file is written to exercise: with Redis unavailable
# the hub degrades to standalone ingestion and the daemon keeps serving — no
# event loss, no restart.

state_root = "/data/state"
config_path = "/etc/trouble/config.light-hub.toml"

[secrets]
# Same reason as token_file below: the container's uid (65532) can only write
# inside the state volume, so both secret files live there at 0600.
environment_file = "/data/state/trouble.env"

[server]
profile = "light-hub"

[server.redis]
url = "redis://redis:6379/0"
# The trouble-side declarations of the two Redis settings the SPEC-13 §2.1.1
# preflight inspects: require_persistence makes appendonly=no a boot refusal
# (TROUBLE-HUB-016) and check_policy flags a maxmemory-policy other than
# noeviction (TROUBLE-HUB-015, /health.json redis.policy). The settings
# themselves belong to the redis service in docker-compose.yml, not to this
# file: the daemon reads them through INFO and never sets them.
require_persistence = true
check_policy = true

[server.duckbrain]
# Required when profile = light-hub (SPEC-13 §2.1). One namespace per host is
# the documented default; replace the placeholder with this host's id
# (trouble/<origin.host_id>) before switching the compose volume source.
namespace = "trouble/REPLACE-WITH-HOST-ID"

[lifecycle]
heartbeat_interval = "30s"
heartbeat_stale_after = "90s"
idle_heartbeat_interval = "60s"
watchdog_sec = "60s"
drain_timeout = "30s"
upgrade_ready_timeout = "30s"
rollback_depth = 2
self_rss_warn = "80MB"
clock_skew_tolerance = "5s"

[stall]
max_seq_age = "300s"

[checker]
interval = "60s"
confirm_runs = 2
alarm_command = []

[ingest]
bind = "0.0.0.0:7643"
advertised_host = "trouble.example.net"

# A container binds 0.0.0.0 so the published port can reach it, and the SPEC-12
# bind matrix refuses a public ingest.bind whose nonloopback_mode is not
# "proxy" while public_require_proxy is on (TROUBLE-LIFECYCLE-003: `public
# ingest.bind "0.0.0.0:7643" requires proxy mode`). The docker port mapping IS
# the ingress proxy here — the socket is only reachable through
# 127.0.0.1:7643 on the host — so the declaration is proxy, not token.
[ingest.auth]
loopback_dsn = true
nonloopback_mode = "proxy"
public_require_proxy = true

[dashboard]
bind = "0.0.0.0:7644"
# A fresh docker volume is created root:root 0755, so uid 65532 cannot create
# files at the volume ROOT; /data/state ships in the image as 0700 + 65532 and
# is writable. A compose `secrets:` entry cannot be used at all - it mounts
# 0444 root-owned, which trips this file's 0600 check (TROUBLE-LIFECYCLE-013).
token_file = "/data/state/dashboard.token"
# Off loopback the dashboard requires a declared trust mandate
# (TROUBLE-DASHBOARD-006 mandate_required): the container's only ingress is the
# published port on the host's loopback, i.e. a proxy. "tailnet" is the other
# accepted value.
mandate = "proxy"
# TROUBLE-LIFECYCLE-001 (public_origin_required): a non-loopback dashboard bind
# must declare the origin users reach it on. Replace the placeholder host.
public_origin = "https://trouble.example.net"

[dashboard.auth]
transport = "cookie"
identity_provider = ""
session_ttl = "24h"

[hub]
mode = "hub"
url = ""
forward_project_id = ""
token = ""
protocol_version = 1
forward_batch_records = 200
forward_batch_bytes = 524288
retry_base = "2s"
retry_max = "5m"
dedup_lru = 65536

[spool]
budget_bytes = 268435456
gap_reserve_bytes = 2097152
fsync = "group"
fsync_window_ms = 200

[verify]
zone_windows = "loopback=10m lan=15m tailnet=20m public=30m"

[escalate]
channels = []
timeout = "10s"

[origin]
host_id = ""
hub_id = ""

[[projects]]
id = "1"
slug = "trouble-dev"
public_key = "0123456789abcdef0123456789abcdef"
quota_epm = 600
enabled = true

[issues]
enabled = false

[skills]
enabled = false
