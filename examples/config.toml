# trouble v0.1 example configuration (SPEC-12).
# Copy to ~/.config/trouble/config.toml and edit host-specific values.

state_root = "~/.local/state/trouble"
config_path = "~/.config/trouble/config.toml"

[secrets]
environment_file = "~/.config/trouble/trouble.env"

[lifecycle]
heartbeat_interval = "30s"
heartbeat_stale_after = "90s"
idle_heartbeat_interval = "60s"
watchdog_sec = "60s"
drain_timeout = "30s"
upgrade_ready_timeout = "30s"
rollback_depth = 2
self_rss_warn = "80MB"
clock_skew_tolerance = "5s"

[stall]
max_seq_age = "300s"

[checker]
interval = "60s"
confirm_runs = 2
alarm_command = []

[ingest]
bind = "127.0.0.1:7643"
# A NAME the reporting apps resolve — never an IP literal, never "localhost"
# (SPEC-04 §2.2): the DSN is baked into every deployed app, so a bind address
# here is a fleet-wide silent-no-report. Replace this placeholder with your host.
advertised_host = "trouble.example.net"

[ingest.auth]
# true = a loopback request authenticates with the project's DSN public key
# alone (SPEC-12 §3.1). Off loopback the bind matrix still requires the token.
loopback_dsn = true
nonloopback_mode = "token"
public_require_proxy = true

[dashboard]
bind = "127.0.0.1:7644"

[dashboard.auth]
transport = "cookie"
identity_provider = ""
session_ttl = "24h"

[hub]
mode = "hub"
url = ""
forward_project_id = ""
token = ""
protocol_version = 1
forward_batch_records = 200
forward_batch_bytes = 524288
retry_base = "2s"
retry_max = "5m"
dedup_lru = 65536

# --- [server] the server profile (SPEC-13) ---------------------------------
# Default is `standalone`: in-process ingestion, zero external dependency.
# `light-hub` reads events through a Redis stream + consumer group and archives
# closed ledger generations to DuckBrain; it declares server.redis.url AND
# server.duckbrain.namespace or the boot refuses with TROUBLE-HUB-001 before any
# listener is bound. Every key is ordinary config (`trouble config explain`
# shows which source won), and the Redis stream/group/dedup/archival behaviour
# itself is internal/hub's (SPEC-13 §2.3).
#
# [server]
# profile = "light-hub"
#
# [server.redis]
# url = "redis://127.0.0.1:6379/0"
# require_persistence = true   # appendonly=no becomes a boot refusal (TROUBLE-HUB-016)
# check_policy = true          # maxmemory-policy must be noeviction (TROUBLE-HUB-015)
#
# [server.duckbrain]
# namespace = "trouble/<host_id>"   # required when profile = light-hub
# endpoint = ""                     # the duckbrain driver endpoint

[spool]
budget_bytes = 268435456
gap_reserve_bytes = 2097152
fsync = "group"
fsync_window_ms = 200

[verify]
zone_windows = "loopback=10m lan=15m tailnet=20m public=30m"

[escalate]
channels = []
timeout = "10s"

[origin]
host_id = ""
hub_id = ""

# ---------------------------------------------------------------------------
# The sentinel's project set (SPEC-12 §3.1a): one [[projects]] table per app
# that may report to this instance. The ingest listener is only built when at
# least one project is declared — with none, the port stays closed, the refusal
# is recorded, and /health.json reports it (SPEC-12 §3.3a).
#
# id                numeric-as-string, 1..2^31-1 — the DSN path element
# public_key        exactly 32 lowercase hex. THE place to put your own:
#                   bin/trouble config explain projects shows what is declared.
# slug              display name; defaults to the id
# quota_epm         events/minute, default 600
# disk_budget_bytes per-project budget, default 2147483648 (2 GiB)
# loss_policy       sample | drop-with-counter | spool-if-light
# secret            only needed when [ingest.auth] loopback_dsn = false
# ---------------------------------------------------------------------------

[[projects]]
id = "1"
slug = "trouble-dev"
# A PLACEHOLDER key: valid in shape (32 lowercase hex) so the shipped example
# boots, and useless as a credential. Replace it before anything reports here.
public_key = "0123456789abcdef0123456789abcdef"
quota_epm = 600
enabled = true

# ---------------------------------------------------------------------------
# OPTIONAL SUBSYSTEMS — the issue desk and the skill loop are OFF, deliberately.
#
# The two tables below are LIVE keys: [issues] and [skills] are part of the
# config schema (SPEC-12 §3.1b) and each one is handed, verbatim, to the
# subsystem that owns it. What you read here is the posture the daemon runs
# with — uncommenting the opt-in named in either block is all it takes.
#
# Off is the shipped compiled default of both (SPEC-09 §3.4a, SPEC-11 §2a), and
# it is the only credential-free posture: nothing is compiled in — no owner/repo,
# no token, no distribution channel — so an ENABLED subsystem has no usable
# driver/source, is refused at boot (TROUBLE-ISSUES-003 / TROUBLE-SKILLS-001) and
# leaves /health.json degraded. OFF keeps a stock boot complete: both subsystems
# are built and idle, no outbound call is made, and /health.json reads ok.
#
# A declaration that cannot be built is never ignored: it is refused, recorded
# on the ledger, and named in the /health.json subsystem row (SPEC-12 §3.3a).
# ---------------------------------------------------------------------------

# --- [issues] --------------------------------------------------------------
# The issue desk (SPEC-09 §3.4a) is OFF, built and idle: no driver is
# constructed, no credential is read, no outbound call is made. ON, it files one
# issue per sig, folds every recurrence into it, keeps its caps, and closes it on
# quiet. To turn it ON, set both of these — a real GitHub repo plus a token in
# TROUBLE_GITHUB_TOKEN or a 0600 ~/.config/trouble/github.token:
#
#   [issues]
#   enabled = true
#   [issues.drivers.github]
#   enabled = true
#   owner = "your-org"
#   repo  = "your-repo"
#
# ...or use the local-first backend instead of GitHub:
#
#   [issues.drivers.github]
#   enabled = false
#   [issues.drivers.duckbrain]
#   enabled = true
#   base_url = "http://127.0.0.1:7645"
#
# Enabling the desk with neither is refused at boot with the key it is missing
# ("driver github needs owner and repo" / "no enabled driver"), never silently.
# Every other key of the table (dedup_window, caps, spool_*, ...) defaults to
# SPEC-09 §3.4 and is listed by `bin/trouble config explain`.
# ---------------------------------------------------------------------------

[issues]
enabled = false

# --- [skills] --------------------------------------------------------------
# The skill loop (SPEC-11 §2a) is OFF, built and idle: the daemon pulls nothing
# and no skill is ever applied. ON, it reads the channel every pull_interval and
# applies only signed artifacts that pass every gate (signature, version floor,
# canary, approve policy, allowed modules). To turn it ON, set exactly ONE of the
# two source keys in this table:
#
#   [skills]
#   enabled = true
#   source_path = "/srv/skills/release.git"        # a local git dir or bare repo
#   # source_url = "https://host/org/skills.git"   # ...or a remote channel
#
# Enabling it with neither, or with both, is refused at boot with
# TROUBLE-SKILLS-001 naming the key.
# ---------------------------------------------------------------------------

[skills]
enabled = false
