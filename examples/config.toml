# trouble v0.1 example configuration (SPEC-12).
# Copy to ~/.config/trouble/config.toml and edit host-specific values.

state_root = "~/.local/state/trouble"
config_path = "~/.config/trouble/config.toml"

[secrets]
environment_file = "~/.config/trouble/trouble.env"

[lifecycle]
heartbeat_interval = "30s"
heartbeat_stale_after = "90s"
idle_heartbeat_interval = "60s"
watchdog_sec = "60s"
drain_timeout = "30s"
upgrade_ready_timeout = "30s"
rollback_depth = 2
self_rss_warn = "80MB"
clock_skew_tolerance = "5s"

[stall]
max_seq_age = "300s"

[checker]
interval = "60s"
confirm_runs = 2
alarm_command = []

[ingest]
bind = "127.0.0.1:7643"
# A NAME the reporting apps resolve — never an IP literal, never "localhost"
# (SPEC-04 §2.2): the DSN is baked into every deployed app, so a bind address
# here is a fleet-wide silent-no-report. Replace this placeholder with your host.
advertised_host = "trouble.example.net"

[ingest.auth]
# true = a loopback request authenticates with the project's DSN public key
# alone (SPEC-12 §3.1). Off loopback the bind matrix still requires the token.
loopback_dsn = true
nonloopback_mode = "token"
public_require_proxy = true

[dashboard]
bind = "127.0.0.1:7644"

[dashboard.auth]
transport = "cookie"
identity_provider = ""
session_ttl = "24h"

[hub]
mode = "hub"
url = ""
forward_project_id = ""
token = ""
protocol_version = 1
forward_batch_records = 200
forward_batch_bytes = 524288
retry_base = "2s"
retry_max = "5m"
dedup_lru = 65536

[spool]
budget_bytes = 268435456
gap_reserve_bytes = 2097152
fsync = "group"
fsync_window_ms = 200

[verify]
zone_windows = "loopback=10m lan=15m tailnet=20m public=30m"

[escalate]
channels = []
timeout = "10s"

[origin]
host_id = ""
hub_id = ""

# ---------------------------------------------------------------------------
# The sentinel's project set (SPEC-12 §3.1a): one [[projects]] table per app
# that may report to this instance. The ingest listener is only built when at
# least one project is declared — with none, the port stays closed, the refusal
# is recorded, and /health.json reports it (SPEC-12 §3.3a).
#
# id                numeric-as-string, 1..2^31-1 — the DSN path element
# public_key        exactly 32 lowercase hex. THE place to put your own:
#                   bin/trouble config explain projects shows what is declared.
# slug              display name; defaults to the id
# quota_epm         events/minute, default 600
# disk_budget_bytes per-project budget, default 2147483648 (2 GiB)
# loss_policy       sample | drop-with-counter | spool-if-light
# secret            only needed when [ingest.auth] loopback_dsn = false
# ---------------------------------------------------------------------------

[[projects]]
id = "1"
slug = "trouble-dev"
# A PLACEHOLDER key: valid in shape (32 lowercase hex) so the shipped example
# boots, and useless as a credential. Replace it before anything reports here.
public_key = "0123456789abcdef0123456789abcdef"
quota_epm = 600
enabled = true
